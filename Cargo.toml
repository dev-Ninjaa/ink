[workspace]
resolver = "2"
members = [
    "crates/repository_intelligence",
    "crates/dependency_graph",
    "crates/context_optimizer",
    "mcp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "A high-performance repository intelligence engine for the Ink platform."
keywords = ["repository", "analysis", "scanner", "intelligence", "cli"]
categories = ["development-tools"]

[workspace.dependencies]
walkdir = "2"
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
dashmap = "6"
petgraph = "0.8"

dhat = "0.3"
tempfile = "3"

[workspace.dependencies.criterion]
version = "0.5"
default-features = false
features = ["cargo_bench_support"]