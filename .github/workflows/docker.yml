name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "extension/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "extension/**"
      - "docs/**"
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build, smoke test, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ink-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — MCP initialize over Streamable HTTP
        run: |
          docker run -d --name ink-mcp -p 3000:3000 ink-mcp:ci

          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/mcp && break
            sleep 1
          done

          RESPONSE=$(curl -s -X POST http://localhost:3000/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"serverInfo"' || {
            echo "::error::MCP initialize did not return serverInfo"; exit 1;
          }

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
